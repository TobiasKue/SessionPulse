name: Release

# Pushing a tag vX.Y.Z builds both packages and publishes a GitHub release.
# See docs/releasing.md for the steps before tagging.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  # A tag doesn't trigger ci.yml, so run the same tests on all three systems here.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Check versions match the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          props=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          plugin=$(jq -r .version claude-plugin/.claude-plugin/plugin.json)
          echo "tag=$version Directory.Build.props=$props plugin.json=$plugin"
          if [[ "$version" != "$props" || "$version" != "$plugin" ]]; then
            echo "::error::Version mismatch; update Directory.Build.props and claude-plugin/.claude-plugin/plugin.json"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=${version//./_}" >> "$GITHUB_OUTPUT"


      - name: Build and pack the Logi plugin
        run: |
          dotnet build src/SessionPulsePlugin --configuration Release -p:DevLink=false -p:ReleasePackage=true
          dotnet tool restore
          dotnet logiplugintool pack artifacts/plugin/Release/ "artifacts/SessionPulse_${{ steps.version.outputs.file }}.lplug4"
          dotnet logiplugintool verify "artifacts/SessionPulse_${{ steps.version.outputs.file }}.lplug4"

      - name: Pack the Claude plugin
        run: |
          (cd claude-plugin && zip -r -X "../artifacts/sessionpulse-claude-plugin-${{ steps.version.outputs.version }}.zip" .)
          zip -j -X "artifacts/sessionpulse-claude-plugin-${{ steps.version.outputs.version }}.zip" LICENSE
          unzip -l "artifacts/sessionpulse-claude-plugin-${{ steps.version.outputs.version }}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > artifacts/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "SessionPulse $version" \
            --notes-file artifacts/notes.md \
            --verify-tag \
            "artifacts/SessionPulse_${{ steps.version.outputs.file }}.lplug4" \
            "artifacts/sessionpulse-claude-plugin-$version.zip"
